# Authentication Service with its PostgreSQL.
# Usage: copy .env.example to .env, set DB_USERNAME, DB_PASSWORD, INTERNAL_API_KEY and
# JWT_PRIVATE_KEY, then run "docker compose up --build". The other services are not part of this
# file: User Service reads the public key from http://<host>:8081/.well-known/jwks.json.
name: authentication-service

services:
  app:
    build: .
    image: authentication-service:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The "docker" profile points the application to the host "postgres", which is the service
      # name below. SERVER_PORT is not passed on purpose: it must stay 8081, the port that is
      # published below.
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-auth_service_db}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required, see .env.example}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      # The shared key of the internal endpoints (header X-Internal-Key). The same value must be
      # set in the Gateway and in User Service. The application does not start without it.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required, see .env.example}
      # The RSA private key that signs the tokens. The application does not start without it.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required, see .env.example}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      # The other services check the same value in the "iss" claim.
      JWT_ISSUER: ${JWT_ISSUER:-authentication-service}
      # The first admin: set both or neither. Both empty means that no admin is created.
      ADMIN_LOGIN: ${ADMIN_LOGIN:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
    volumes:
      - app-logs:/app/logs

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-auth_service_db}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required, see .env.example}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
    volumes:
      # PostgreSQL 18+ images keep the data directory under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # "-h 127.0.0.1" forces a TCP connection. Without it pg_isready also succeeds on the
      # temporary server of the first start, which listens only on a Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  app-logs:

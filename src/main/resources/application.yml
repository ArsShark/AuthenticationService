spring:
  application:
    name: authentication-service
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    # At WARN, Hibernate logs the DETAIL of a failed statement: the whole failing row, including
    # password_hash. Keep this logger at ERROR.
    org.hibernate.orm.jdbc.error: ERROR

spring:
  application:
    name: authentication-service
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    # At WARN, Hibernate logs the DETAIL of a failed statement: the whole failing row, including
    # password_hash. Keep this logger at ERROR.
    org.hibernate.orm.jdbc.error: ERROR

app:
  internal:
    # The shared key of the internal endpoints (header X-Internal-Key). There is no real default:
    # an empty value stops the startup.
    api-key: ${INTERNAL_API_KEY:}
  admin:
    # The first admin, created at startup if the login does not exist yet. Set both or neither.
    login: ${ADMIN_LOGIN:}
    password: ${ADMIN_PASSWORD:}
  jwt:
    # The RSA private key that signs the tokens: PKCS#8 DER, base64 on one line (see the README).
    # There is no default: an empty value stops the startup. The public key and the key id are
    # derived from it.
    private-key: ${JWT_PRIVATE_KEY:}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
    issuer: ${JWT_ISSUER:authentication-service}

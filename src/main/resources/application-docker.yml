# Profile "docker": the application runs in a container, PostgreSQL is reached by the service
# name of the Compose network. Environment variables override every default.
# Credentials (DB_USERNAME, DB_PASSWORD) have no defaults and are never stored in this file.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:auth_service_db}
app:
  user-service:
    # The internal address of the User Service (never the API Gateway).
    base-uri: ${USER_SERVICE_URI:http://user-service:8082}

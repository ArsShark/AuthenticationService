databaseChangeLog:
  - changeSet:
      id: create-credentials-table
      author: arsshark
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credentials
              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_credentials_login
              - column:
                  name: password_hash
                  type: VARCHAR(60)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_credentials_user_id
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        # CHECK constraints are plain SQL: the Liquibase change type addCheckConstraint
        # needs a paid license.
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE credentials
              ADD CONSTRAINT ck_credentials_role
              CHECK (role IN ('ADMIN', 'USER'))
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE credentials
              ADD CONSTRAINT ck_credentials_user_id_required
              CHECK (role = 'ADMIN' OR user_id IS NOT NULL)

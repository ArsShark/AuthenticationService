databaseChangeLog:
  - changeSet:
      id: rename-credentials-login-to-username
      author: arsshark
      changes:
        - renameColumn:
            tableName: credentials
            oldColumnName: login
            newColumnName: username
            columnDataType: VARCHAR(255)
        # The UNIQUE constraint keeps working after the column is renamed, only its name is old.
        # PostgreSQL renames the index that backs the constraint together with the constraint.
        - sql:
            dbms: postgresql
            sql: >-
              ALTER TABLE credentials
              RENAME CONSTRAINT uq_credentials_login TO uq_credentials_username
